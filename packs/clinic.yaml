# Industry pack: clinic (appointment management for registered patients, Anvia Phase 1).
# Pure config, validated by salesbot_core.packs.schema.Pack. Clinic-specific values (name,
# doctors, hours, phone) live in the database, not here.
#
# Wording policy (docs/DECISIONS.md): patient-facing text never mentions AI, bots, virtual or
# automated assistants and never claims to be a person or staff member. The only exception is
# conversation.sincere_ask.answer. Enforced by packages/core/tests/test_wording.py.
#
# DRAFT: every Hindi and Marathi line until a native speaker reviews it, the sincere-ask answer,
# and the emergency message (needs clinical sign-off). DRAFT text is never sent to real patients.
id: clinic
name: Clinic
version: 1
languages: [en, hi, mr]
draft_languages: [hi, mr]
draft_messages: [emergency, voice.task_created_urgent]

# Voice greeting (inbound calls).
greeting:
  en: "Hello, thank you for calling {business_name}. How can I help you today?"
  hi: "नमस्ते, {business_name} में कॉल करने के लिए धन्यवाद। मैं आपकी कैसे मदद करूँ?"
  mr: "नमस्कार, {business_name} मध्ये फोन केल्याबद्दल धन्यवाद. मी तुमची कशी मदत करू?"

# Patients register through the intake form (docs/INTAKE_CONTRACT.md); calls only ask when.
intake_questions:
  - key: preferred_time
    type: date
    prompt:
      en: "When would you like to come in?"
      hi: "आप कब आना चाहेंगे?"
      mr: "तुम्हाला कधी यायला आवडेल?"

# Indicative only: visit lengths are set per doctor in the clinic setup.
services:
  - id: first_visit
    name: { en: "First visit", hi: "पहली विज़िट", mr: "पहिली भेट" }
    duration_minutes: 30
  - id: consultation
    name: { en: "Consultation", hi: "परामर्श", mr: "सल्ला" }
    duration_minutes: 15

emergency:
  action: handoff
  triggers:
    # English
    - "emergency"
    - "chest pain"
    - "can't breathe"
    - "cant breathe"
    - "cannot breathe"
    - "not breathing"
    - "difficulty breathing"
    - "breathing problem"
    - "short of breath"
    - "unconscious"
    - "fainted"
    - "fainting"
    - "passed out"
    - "heavy bleeding"
    - "bleeding a lot"
    - "bleeding heavily"
    - "won't stop bleeding"
    - "wont stop bleeding"
    - "severe pain"
    - "unbearable pain"
    - "accident"
    - "seizure"
    - "heart attack"
    - "stroke"
    - "poison"
    # Hindi (Devanagari)
    - "इमरजेंसी"
    - "सीने में दर्द"
    - "छाती में दर्द"
    - "सांस नहीं"
    - "साँस नहीं"
    - "सांस लेने में"
    - "साँस लेने में"
    - "बेहोश"
    - "बहुत खून"
    - "खून बह"
    - "खून निकल"
    - "बहुत तेज दर्द"
    - "असहनीय दर्द"
    - "एक्सीडेंट"
    - "दुर्घटना"
    - "दिल का दौरा"
    - "जहर"
    # Hindi (romanized / Hinglish)
    - "emergency hai"
    - "seene mein dard"
    - "seene me dard"
    - "sine mein dard"
    - "sine me dard"
    - "chhati mein dard"
    - "chhati me dard"
    - "chati mein dard"
    - "chati me dard"
    - "saans nahi"
    - "sans nahi"
    - "saans lene"
    - "sans lene"
    - "khoon beh"
    - "khoon nikal"
    - "bahut khoon"
    - "behosh"
    - "bahut tez dard"
    - "bahut zyada dard"
    - "dil ka daura"
    - "आणीबाणी"
    - "छातीत दुख*"
    - "श्वास घेता येत नाही"
    - "दम लागत*"
    - "बेशुद्ध"
    - "खूप रक्त"
    - "अपघात"
    - "विष"
    - "beshuddh"
    - "apghat"
    # Marathi (lower-tested)
    - "chhatit dukh*"
    - "chatit dukh*"
    - "shwas gheta yet nahi"
    - "khup rakt"
  message:
    en: "That sounds urgent. Please call the clinic right away, or go to the nearest hospital."
    hi: "यह ज़रूरी लग रहा है। कृपया अभी क्लिनिक को कॉल करें या नज़दीकी अस्पताल जाएँ।"
    mr: "हे तातडीचं वाटतंय. कृपया लगेच क्लिनिकला फोन करा किंवा जवळच्या रुग्णालयात जा."

lead_stages: [new, contacted, booked, confirmed, showed, no_show, lost]

# Answered at any step of the conversation, then the current question is asked again.
# `demo: true` = DEMO text for the local demo only (docs/DEMO.md): fictional, used only when
# the engine runs with FlowContext.demo. A real clinic's address, parking, fee and insurance
# answers belong in its own settings, not in this pack. Opening hours come from the doctors'
# hours in the database. The doctor question gets a neutral line: no claims about quality.
faqs:
  - id: hours
    source: opening_hours
    keywords: ["opening hours", "open hours", "hours", timing, timings, "what time do you open",
               "when are you open", "when do you open", "when do you close", "closing time",
               "kab khul*", "kab tak khula", "खुलता", "खुला", "khulta", "वेळा"]
    question: { en: "What are your opening hours?" }
    answer:
      en: "Opening hours:\n{hours}"
      hi: "खुलने का समय:\n{hours}"
      mr: "उघडण्याच्या वेळा:\n{hours}"
  - id: address
    demo: true
    keywords: [address, location, located, directions, "where is", "where are you",
               "how do i get", "how to reach", "kahan hai", "कहाँ है", "कहां है", "पत्ता",
               "kuthe ahe", "कुठे आहे"]
    question: { en: "Where is the clinic?" }
    answer:
      en: "Address: Demo Clinic, 12 Example Road, Pune (fictional)."
      hi: "पता: डेमो क्लिनिक, 12 एग्ज़ाम्पल रोड, पुणे (काल्पनिक)।"
      mr: "पत्ता: डेमो क्लिनिक, 12 एक्झाम्पल रोड, पुणे (काल्पनिक)."
  - id: parking
    demo: true
    keywords: [parking, park, "पार्किंग"]
    question: { en: "Is there parking?" }
    answer:
      en: "Free patient parking is available in the building basement (demo text)."
      hi: "मरीज़ों के लिए बिल्डिंग के बेसमेंट में मुफ़्त पार्किंग है (डेमो टेक्स्ट)।"
      mr: "रुग्णांसाठी इमारतीच्या तळघरात मोफत पार्किंग आहे (डेमो मजकूर)."
  - id: fee
    demo: true
    keywords: [fee, fees, cost, costs, charge, charges, price, "how much", "kitne paise",
               "kitni fees", "fees kitni", "फीस", "शुल्क", "कितने पैसे", "किती पैसे"]
    question: { en: "How much is a consultation?" }
    answer:
      en: "The consultation fee is Rs 500 (demo text)."
      hi: "कंसल्टेशन फीस 500 रुपये है (डेमो टेक्स्ट)।"
      mr: "कन्सल्टेशन फी 500 रुपये आहे (डेमो मजकूर)."
  - id: insurance
    demo: true
    keywords: [insurance, insured, cashless, mediclaim, "bima", "बीमा", "इंश्योरेंस", "विमा"]
    question: { en: "Do you take insurance?" }
    answer:
      en: "Please bring your policy card and the clinic team will confirm cover (demo text)."
      hi: "कृपया अपना पॉलिसी कार्ड साथ लाएँ, क्लिनिक की टीम कवर की पुष्टि करेगी (डेमो टेक्स्ट)।"
      mr: "कृपया तुमचं पॉलिसी कार्ड सोबत आणा, क्लिनिकची टीम कव्हरची खात्री करेल (डेमो मजकूर)."
  - id: doctor_quality
    offer_human: true
    keywords: ["doctor good", "doctors good", "good doctor", "doctor any good", "best doctor",
               "doctor experienced", "experienced", "qualified", "reviews", "rating",
               "doctor accha", "doctor achha", "acche doctor", "अच्छे डॉक्टर", "डॉक्टर अच्छे"]
    question: { en: "Is the doctor good?" }
    answer:
      en: "The clinic team can answer questions about our doctors. Choose Talk to clinic and they will contact you."
      hi: "डॉक्टरों के बारे में सवालों के जवाब क्लिनिक की टीम दे सकती है। 'क्लिनिक से बात करें' चुनें, टीम आपसे संपर्क करेगी।"
      mr: "डॉक्टरांबद्दलच्या प्रश्नांची उत्तरं क्लिनिकची टीम देऊ शकते. 'क्लिनिकशी बोला' निवडा, टीम तुमच्याशी संपर्क करेल."

conversation:
  # Live channels send this while the emergency message is DRAFT (clinical review pending).
  # Numbers and symbols only, so it needs no review and reads the same in every language.
  emergency_fallback: "🚑 {emergency_numbers} · ☎ {clinic_phone}"

  sincere_ask:
    draft: true
    triggers:
      - "are you a bot"
      - "are you human"
      - "are you a human"
      - "are you a robot"
      - "are you real"
      - "is this a bot"
      - "is this automated"
      - "am i talking to a bot"
      - "am i talking to a person"
      - "am i talking to a real person"
      - "bot"
      - "chatbot"
      - "robot"
      - "ai"
      - "machine"
      - "computer"
      - "kya aap bot"
      - "bot ho"
      - "robot ho"
      - "insaan ho"
      - "बॉट"
      - "रोबोट"
      - "मशीन"
      - "क्या आप इंसान"
      - "इंसान हो"
      - "तुम्ही माणूस"
      - "माणूस आहात"
      - "manus ahat"
    answer:
      en: "This is {business_name}'s automated appointment service. For anything else, choose Talk to clinic."
      hi: "यह {business_name} की स्वचालित अपॉइंटमेंट सेवा है। किसी और काम के लिए 'क्लिनिक से बात करें' चुनें।"
      mr: "ही {business_name} ची स्वयंचलित अपॉइंटमेंट सेवा आहे. इतर कशासाठीही 'क्लिनिकशी बोला' निवडा."

  intents:
    book: [book, booking, appointment, "appoint*", slot, visit, "see the doctor", "बुक*",
           "अपॉइंटमेंट", "appointment chahiye", dikhana, "दिखाना", "भेट", bhet, milna, "मिलना"]
    reschedule: ["reschedul*", change, move, postpone, prepone, "another time", "different time",
                 "badal*", "बदल*", "pudhe", "पुढे ढकल*"]
    cancel: ["cancel*", cancle, "radd*", "रद्द", "कैंसल", "कॅन्सल", "nahi aana", "नहीं आना",
             "नाही येणार", "nahi yenar"]
    # "confirm" outside a pending question confirms the upcoming appointment; inside a
    # yes/no question it counts as yes.
    confirm: ["confirm*", "conform*", "कन्फ*", "पक्का", pakka]
    "yes": ["yes", yeah, yep, ya, yup, "ok", okay, okk, "k", sure, done, haan, han, haa,
            "हाँ", "हां", ji, "जी", theek, thik, "ठीक", "kar do", "कर दो", "ho", hoy, "होय",
            "हो", chalel, "चालेल", kara, "करा", barobar, "बरोबर"]
    "no": ["no", nope, nah, "not now", nahi, nahin, "नहीं", "नही", mat, "मत", nako, "नको",
           "नाही", "rehne do", "रहने दो", "rahu dya", "राहू द्या", keep]
    human: [human, person, "real person", staff, receptionist, "talk to", "speak to",
            "call me", "call back", callback, manager, "doctor se baat", "baat kar*",
            "बात कर*", "phone karo", "call karo", "फोन करो", "कॉल करो", "फोन करा", "कॉल करा",
            bolaycha, "बोलायचं", "बोलायचे"]
    menu: [menu, hi, hello, hey, namaste, "नमस्ते", "नमस्कार", namaskar, help, start, options,
           "मदद", madad]
    more: [more, later, aur, "और", aankhi, "आणखी", next, baad, "बाद"]
    thanks: [thanks, "thank you", thx, ty, dhanyavad, dhanyawad, "धन्यवाद", shukriya, "शुक्रिया",
             "great", "👍", "🙏"]
    stop: [stop, unsubscribe, "band karo", "बंद करो", "बंद करा", "band kara", "मेसेज बंद",
           "mat bhejo", "मत भेजो", "पाठवू नका", "pathvu naka"]

  messages:
    welcome:
      en: "Hello {client_name}, welcome to {business_name}. Would you like to book your first visit?"
      hi: "नमस्ते {client_name}, {business_name} में आपका स्वागत है। क्या आप अपनी पहली विज़िट बुक करना चाहेंगे?"
      mr: "नमस्कार {client_name}, {business_name} मध्ये तुमचं स्वागत आहे. तुमची पहिली भेट बुक करायची आहे का?"
    not_now:
      en: "No problem. Message us any time to book."
      hi: "कोई बात नहीं। बुक करने के लिए कभी भी मैसेज करें।"
      mr: "काही हरकत नाही. बुक करण्यासाठी कधीही मेसेज करा."
    menu:
      en: "How can we help you?"
      hi: "हम आपकी क्या मदद कर सकते हैं?"
      mr: "आम्ही तुमची काय मदत करू शकतो?"
    ask_day:
      en: "Which day suits you? These days have free times."
      hi: "आपको कौन-सा दिन ठीक रहेगा? इन दिनों में समय खाली है।"
      mr: "तुम्हाला कोणता दिवस सोयीचा आहे? या दिवशी वेळ उपलब्ध आहे."
    day_full:
      en: "There are no free times on {date}. These days have free times."
      hi: "{date} को कोई समय खाली नहीं है। इन दिनों में समय खाली है।"
      mr: "{date} रोजी वेळ उपलब्ध नाही. या दिवशी वेळ उपलब्ध आहे."
    no_openings_soon:
      en: "There are no free times in the next {days} days. The earliest is {date} at {time} with {doctor}. Shall I book it?"
      hi: "अगले {days} दिनों में कोई समय खाली नहीं है। सबसे पहला समय {date}, {time} है, {doctor} के साथ। क्या इसे बुक कर दें?"
      mr: "पुढील {days} दिवसांत वेळ उपलब्ध नाही. सर्वात लवकरची वेळ {date}, {time} आहे, {doctor} यांच्याकडे. बुक करायची का?"
    no_openings:
      en: "Sorry, there are no free times right now. The clinic team will contact you soon."
      hi: "माफ़ कीजिए, अभी कोई समय खाली नहीं है। क्लिनिक की टीम जल्द ही आपसे संपर्क करेगी।"
      mr: "माफ करा, सध्या वेळ उपलब्ध नाही. क्लिनिकची टीम लवकरच तुमच्याशी संपर्क करेल."
    ask_time:
      en: "Free times on {date}:"
      hi: "{date} को खाली समय:"
      mr: "{date} रोजी उपलब्ध वेळा:"
    time_not_free:
      en: "{time} is not free on {date}. The nearest free times are:"
      hi: "{date} को {time} खाली नहीं है। सबसे नज़दीकी खाली समय:"
      mr: "{date} रोजी {time} उपलब्ध नाही. जवळच्या उपलब्ध वेळा:"
    confirm_slot:
      en: "{doctor}, {date} at {time}. Shall I book it?"
      hi: "{doctor}, {date}, {time}। क्या इसे बुक कर दें?"
      mr: "{doctor}, {date}, {time}. बुक करायची का?"
    booked:
      en: "Your appointment is booked: {doctor}, {date} at {time}."
      hi: "आपका अपॉइंटमेंट बुक हो गया है: {doctor}, {date}, {time}।"
      mr: "तुमची अपॉइंटमेंट बुक झाली आहे: {doctor}, {date}, {time}."
    slot_lost:
      en: "Sorry, that time was just taken. Other free times on {date}:"
      hi: "माफ़ कीजिए, वह समय अभी-अभी बुक हो गया। {date} को दूसरे खाली समय:"
      mr: "माफ करा, ती वेळ आत्ताच बुक झाली. {date} रोजी इतर उपलब्ध वेळा:"
    pick_again:
      en: "Okay. Other free times on {date}:"
      hi: "ठीक है। {date} को दूसरे खाली समय:"
      mr: "ठीक आहे. {date} रोजी इतर उपलब्ध वेळा:"
    abandon_booking:
      en: "Okay, nothing is booked. Message us any time to book."
      hi: "ठीक है, कुछ भी बुक नहीं किया गया। बुक करने के लिए कभी भी मैसेज करें।"
      mr: "ठीक आहे, काहीही बुक केलेलं नाही. बुक करण्यासाठी कधीही मेसेज करा."
    reschedule_none:
      en: "You have no upcoming appointment to change. Would you like to book one?"
      hi: "आपका कोई आने वाला अपॉइंटमेंट नहीं है जिसे बदला जा सके। क्या आप नया बुक करना चाहेंगे?"
      mr: "बदलण्यासाठी तुमची कोणतीही आगामी अपॉइंटमेंट नाही. नवीन बुक करायची आहे का?"
    reschedule_start:
      en: "Your appointment is {doctor}, {date} at {time}. Which new day suits you?"
      hi: "आपका अपॉइंटमेंट {doctor}, {date}, {time} है। नया दिन कौन-सा ठीक रहेगा?"
      mr: "तुमची अपॉइंटमेंट {doctor}, {date}, {time} आहे. नवीन कोणता दिवस सोयीचा आहे?"
    rescheduled:
      en: "Done. Your appointment is moved to {doctor}, {date} at {time}."
      hi: "हो गया। आपका अपॉइंटमेंट बदलकर {doctor}, {date}, {time} कर दिया गया है।"
      mr: "झालं. तुमची अपॉइंटमेंट बदलून {doctor}, {date}, {time} केली आहे."
    reschedule_pending:
      en: "Your request to move to {date} at {time} is sent to the clinic. Your current appointment stays until they approve it."
      hi: "{date}, {time} पर बदलने का आपका अनुरोध क्लिनिक को भेज दिया गया है। मंज़ूरी मिलने तक आपका मौजूदा अपॉइंटमेंट बना रहेगा।"
      mr: "{date}, {time} अशी वेळ बदलण्याची तुमची विनंती क्लिनिकला पाठवली आहे. मंजुरी मिळेपर्यंत तुमची सध्याची अपॉइंटमेंट कायम राहील."
    cancel_none:
      en: "You have no upcoming appointment to cancel."
      hi: "आपका कोई आने वाला अपॉइंटमेंट नहीं है जिसे रद्द किया जा सके।"
      mr: "रद्द करण्यासाठी तुमची कोणतीही आगामी अपॉइंटमेंट नाही."
    cancel_ask:
